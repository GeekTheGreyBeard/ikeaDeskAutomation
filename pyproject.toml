[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ikea-desk-automation"
version = "0.1.0"
description = "Local-first Bluetooth standing desk automation with optional depth-camera sensing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rodney Rees" }
]
keywords = ["standing-desk", "bluetooth", "ble", "realsense", "linak", "idasen"]
dependencies = [
  "idasen>=0.12,<0.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
realsense = [
  "numpy>=1.26",
  "pyrealsense2>=2.55,<3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ikea-desk = "ikea_desk_automation.cli:main"
geekdesk-control = "ikea_desk_automation.geekdesk_control:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ikea_desk_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
